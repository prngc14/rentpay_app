name: rentpay_app
description: RentPay Rental Billing Application

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  firebase_storage: ^11.7.0
  firebase_messaging: ^14.9.2

  # Local Notifications (para makita ng tenant ang reminder kahit bukas ang app)
  flutter_local_notifications: ^17.1.2

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Image Upload
  image_picker: ^1.0.7
  http: ^1.2.1

  # Blur Detection
  flutter_image_compress: ^2.3.0

  # Charts
  fl_chart: ^0.68.0
  intl: ^0.20.2

  # PDF / Print
  pdf: ^3.11.3
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/rentpay_logo.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#000000"
  image: assets/rentpay_logo.png
  android_12:
    color: "#000000"
    image: assets/rentpay_logo.png
    icon_background_color: "#000000"
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/rentpay_logo.png